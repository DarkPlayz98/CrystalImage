name: Train Crystal Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Crystal Image
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check dataset
        run: |
          python -m darkimage.check_dataset

      - name: Train Crystal Image v0.6
        run: |
          python -m darkimage.train

      - name: Upload trained model and images
        uses: actions/upload-artifact@v4
        with:
          name: crystal-image-v0.6-${{ github.sha }}
          path: |
            checkpoints/*.npz
            checkpoints/*.json
            checkpoints/*.txt
            samples/*.png

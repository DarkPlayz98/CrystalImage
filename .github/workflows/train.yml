name: Crystal Image v1.2

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: crystal-image-v1-2
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create training dataset
        run: |
          rm -rf data/train
          mkdir -p data/train
          python -m darkimage.create_crystal_dataset

      - name: Check dataset
        run: |
          python -m darkimage.check_dataset

      - name: Train Crystal Image v1.2
        run: |
          python -m darkimage.train

      - name: Generate 1536x1536 sample
        run: |
          python -m darkimage.generate

      - name: Upload generated image
        uses: actions/upload-artifact@v4
        with:
          name: Crystal-Image-v1.2-1536x1536
          path: generated_crystal_v1_2.png
          if-no-files-found: error

      - name: Upload model checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: Crystal-Image-v1.2-Model
          path: checkpoints/crystal_image_v1_2.pt
          if-no-files-found: error

      - name: Upload vocabulary
        uses: actions/upload-artifact@v4
        with:
          name: Crystal-Image-v1.2-Vocabulary
          path: checkpoints/crystal_image_v1_2_vocab.json
          if-no-files-found: error

name: Train Crystal Image

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    name: Crystal Image Training
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Python
      # -----------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # -----------------------------
      # Dependencies
      # -----------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------
      # Dataset
      # -----------------------------
      - name: Create 64x64 training dataset
        run: |
          python -m darkimage.create_crystal_dataset

      # -----------------------------
      # Dataset validation
      # -----------------------------
      - name: Check dataset
        run: |
          python -m darkimage.check_dataset

      # -----------------------------
      # Train model
      # -----------------------------
      - name: Train Crystal Image v0.8
        run: |
          python -m darkimage.train

      # -----------------------------
      # Generate test image
      # -----------------------------
      - name: Generate test image
        run: |
          python -m darkimage.generate

      # -----------------------------
      # Artifact: generated image
      # -----------------------------
      - name: Upload generated image
        uses: actions/upload-artifact@v4
        with:
          name: crystal-image-v0.8-sample
          path: generated_crystal_v0_8.png
          if-no-files-found: error

      # -----------------------------
      # Artifact: model
      # -----------------------------
      - name: Upload model checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: crystal-image-v0.8-checkpoint
          path: checkpoints/crystal_image_v0_8.npz
          if-no-files-found: error

      # -----------------------------
      # Artifact: vocabulary
      # -----------------------------
      - name: Upload vocabulary
        uses: actions/upload-artifact@v4
        with:
          name: crystal-image-v0.8-vocabulary
          path: checkpoints/crystal_image_v0_8_vocab.json
          if-no-files-found: error


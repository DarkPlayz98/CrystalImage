name: Crystal Image v1.0 512x512

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: crystal-image-v1-training
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create 512x512 dataset
        run: |
          rm -rf data/train
          mkdir -p data/train
          python -m darkimage.create_crystal_dataset

      - name: Check dataset
        run: |
          python -m darkimage.check_dataset

      - name: Train Crystal Image v1.0
        run: |
          python -m darkimage.train

      - name: Generate crystal
        run: |
          python -m darkimage.generate

      - name: Upload generated crystal
        uses: actions/upload-artifact@v4
        with:
          name: Crystal-Image-v1.0-512x512
          path: generated_crystal_v1_0.png
          if-no-files-found: error

      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: Crystal-Image-v1.0-Model
          path: checkpoints/crystal_image_v1_0.npz
          if-no-files-found: error

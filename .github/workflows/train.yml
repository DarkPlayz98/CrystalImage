name: Train Crystal Image

on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Crystal Image
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        run: |
          python -m darkimage.train

      - name: Upload checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: crystal-image-checkpoint
          path: |
            checkpoints/*.npz
            checkpoints/*.json

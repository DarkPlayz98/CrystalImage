name: Crystal Image v0.9

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create 128x128 dataset
        run: python -m darkimage.create_crystal_dataset

      - name: Check dataset
        run: python -m darkimage.check_dataset

      - name: Train Crystal Image v0.9
        run: python -m darkimage.train

      - name: Generate sample
        run: python -m darkimage.generate

      - name: Upload generated image
        uses: actions/upload-artifact@v4
        with:
          name: crystal-image-v0.9-sample
          path: generated_crystal_v0_9.png

      - name: Upload checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: crystal-image-v0.9-checkpoint
          path: checkpoints/crystal_image_v0_9.npz

      - name: Upload vocabulary
        uses: actions/upload-artifact@v4
        with:
          name: crystal-image-v0.9-vocabulary
          path: checkpoints/crystal_image_v0_9_vocab.json

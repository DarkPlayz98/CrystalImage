name: Crystal Image v0.9 - Long Training

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: crystal-image-training
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create 128x128 dataset
        run: |
          rm -rf data/train
          mkdir -p data/train
          python -m darkimage.create_crystal_dataset

      - name: Check dataset
        run: |
          python -m darkimage.check_dataset

      - name: Train Crystal Image - High Quality
        run: |
          python -m darkimage.train

      - name: Show training outputs
        if: always()
        run: |
          echo "=== Checkpoints ==="
          find checkpoints -type f -print 2>/dev/null || true
          echo "=== Generated images ==="
          find . -maxdepth 2 -type f \( -name "*.png" -o -name "*.jpg" \) -print | head -50

      - name: Generate sample
        run: |
          python -m darkimage.generate

      - name: Upload generated sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crystal-image-v0.9-sample
          path: |
            generated*.png
            outputs/*.png
          if-no-files-found: warn

      - name: Upload trained model
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crystal-image-v0.9-model
          path: checkpoints/*.npz
          if-no-files-found: warn

      - name: Upload vocabulary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crystal-image-v0.9-vocabulary
          path: checkpoints/*vocab*.json
          if-no-files-found: warn
